name: Release

# Fires on a VERSION BUMP, not on every push.
#
# Push to main that changes mobile/src-tauri/tauri.conf.json: the check job
# reads `version` out of it and stops unless package.json, Cargo.toml and
# tauri.conf.json agree AND that version has no tag yet. So the release ritual
# is: bump the version in all three, push. No tagging by hand, and no
# accidental release from an unrelated commit.
#
# The APKs land on a GitHub release as one file per ABI
# (Kryoto-Mobile_<version>_arm64.apk and friends). A per-ABI APK only carries
# its own phone's native lib, instead of all four bundled together.
#
# Release APKs, not debug: the build runs `tauri android build --apk
# --split-per-abi` WITHOUT --debug, so Gradle assembles the `release` build
# type (minify + stripped .so via the [profile.release] in Cargo.toml) instead
# of the `debug` one (debug symbols kept per ABI, ~300MB). Release builds must
# be signed. With the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
# (and optional ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD) secrets set, every
# release is signed with that same key, so a new version installs over the
# last one. A missing key fails the release rather than publishing APKs that
# cannot update an existing installation.
#
# A debug APK (Kryoto-Mobile_<version>_debug.apk, 64-bit phones and
# emulators) rides along: not minified, WebView debugging on, signed with
# Gradle's debug key. For testing, and a fallback if a release build misbehaves.
on:
  push:
    branches: [main]
    paths:
      - 'mobile/src-tauri/tauri.conf.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# One release at a time; a second bump waits rather than racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          version=$(node -p "require('./mobile/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version *= *"\(.*\)"/\1/p' mobile/src-tauri/Cargo.toml | head -n 1)
          if [ "$version" != "$pkg" ] || [ "$version" != "$cargo" ]; then
            echo "::error::Versions differ: tauri.conf.json $version, package.json $pkg, Cargo.toml $cargo. Bump all three."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # android-actions/setup-android@v3 is deliberately NOT used: its internal
      # `sdkmanager tools` call now fails ("Failed to find package 'tools'",
      # the package was removed years ago) after it upgrades cmdline-tools, and
      # the runner already ships a full SDK at /usr/local/lib/android/sdk
      # (preinstalled cmdline-tools, licenses partial). The next step owns the
      # SDK completely: locate a working sdkmanager, accept licenses, install
      # what the build needs.
      - name: Install Android SDK packages
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$SDKROOT"
          export ANDROID_HOME="$SDKROOT"

          # Prefer sdkmanager on PATH, then search under cmdline-tools, otherwise download latest cmdline-tools
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=$(command -v sdkmanager)
          else
            SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found — installing commandlinetools into $SDKROOT/cmdline-tools/latest"
            tmp=/tmp/cmdline-tools
            rm -rf "$tmp" "$SDKROOT/cmdline-tools/latest"
            mkdir -p "$tmp" && cd "$tmp"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
            unzip -q tools.zip
            mkdir -p "$SDKROOT/cmdline-tools/latest"
            # move the extracted cmdline-tools content into the "latest" install directory
            mv cmdline-tools/* "$SDKROOT/cmdline-tools/latest/" || true
            SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
            cd -
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          # Update repo metadata and accept licenses before installing packages
          "$SDKMANAGER" --sdk_root="$SDKROOT" --update || true
          yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --licenses || true

          # SDK 37's published package ID includes the minor version, just as
          # the platform already installed on the runner and used locally does.
          packages=( "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "ndk;27.0.12077973" )
          attempts=0
          until [ $attempts -ge 3 ]; do
            attempts=$((attempts + 1))
            echo "sdkmanager install attempt $attempts"
            if "$SDKMANAGER" --sdk_root="$SDKROOT" --install "${packages[@]}" </dev/null; then
              break
            fi
            sleep $((attempts * 5))
          done

          installed=$("$SDKMANAGER" --sdk_root="$SDKROOT" --list_installed)
          for package in "${packages[@]}"; do
            if [[ "$installed" != *"$package"* ]]; then
              echo "::error::Android SDK package is missing after installation: $package"
              echo "$installed"
              exit 1
            fi
          done

          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDKROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDKROOT" --list_installed || true
      - run: pnpm install --frozen-lockfile
      - name: Require stable Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" || { echo "::error::Configure stable Android signing secrets before releasing."; exit 1; }

      # Release, not debug: no --debug flag, so the Rust lib builds with
      # [profile.release] (opt-level=z, stripped) and Gradle assembles the
      # `release` build type instead of the symbol-laden `debug` one.
      - name: Build the release APKs (one per ABI)
        working-directory: mobile
        run: pnpm tauri android build --apk --split-per-abi

      # The debug build: not minified, debuggable, Rust symbols stripped so the
      # file stays a sensible size. Gradle signs it with its debug key.
      - name: Build the debug APK
        working-directory: mobile
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_DEV_STRIP: 'true'
        run: pnpm tauri android build --debug --apk --target aarch64 --target x86_64

      # A release APK is unsigned out of Gradle and will not install. Sign
      # every split APK and zipalign it, then rename to
      # Kryoto-Mobile_<version>_<abi>.apk.
      - name: Sign and name the APKs
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            STOREPASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-kryoto}"; KEYPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::error::A stable Android signing key is required. Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD before releasing."
            exit 1
          fi
          mkdir -p out
          for apk in mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk \
                     mobile/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk; do
            [ -f "$apk" ] || continue
            # Gradle names them app-<dir>-release-unsigned.apk where <dir> is
            # arm64 | arm | x86_64 | x86 — map to Android ABI names.
            base=$(basename "$apk" .apk)
            dir=$(echo "$base" | sed -n 's/^app-\(.*\)-release-unsigned$/\1/p')
            case "$dir" in
              arm64) abi="arm64-v8a" ;;
              arm) abi="armeabi-v7a" ;;
              x86_64|x86) abi="$dir" ;;
              universal) abi="universal" ;;
              *) abi=$(echo "$base" | grep -o -E 'arm64-v8a|armeabi-v7a|x86_64|x86|universal' || echo "$base") ;;
            esac
            out="out/Kryoto-Mobile_${VERSION}_${abi}.apk"
            cp "$apk" unsigned.apk
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 unsigned.apk aligned.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/release.jks --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$STOREPASS" --key-pass "pass:$KEYPASS" --out "$out" aligned.apk
            rm unsigned.apk aligned.apk
          done
          debug=mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          [ -f "$debug" ] || { echo "::error::No debug APK was built"; exit 1; }
          cp "$debug" "out/Kryoto-Mobile_${VERSION}_debug.apk"
          ls -la out
          du -h out/*

      - name: Tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" out/*.apk --title "Kryoto Mobile v$VERSION" \
            --notes "Kryoto Mobile v$VERSION for Android. Faster QR pairing with account fallback, simpler connection screens, optional Android notifications and in-app updates. Pick arm64-v8a for most phones. Releases before 0.2.26 used temporary signing keys: uninstall an older build once before installing this stable release. Future stable updates install in the app. The _debug APK is for testing."
