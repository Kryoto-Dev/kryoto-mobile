[package]
name = "kryoto-mobile"
version = "0.2.26"
description = "Kryoto Mobile: the Android companion to Kryoto Desktop."
authors = ["Kryoto"]
license = "MIT"
edition = "2021"

# Its own workspace: the desktop's src-tauri pulls in SDL2, ViGEm and SQLCipher,
# none of which build for Android.
[workspace]

[lib]
name = "kryoto_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

# Scanning the PC's QR code (Android and iOS only; no desktop build of it).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# The phone APK ships one Rust lib per ABI. A debug .so carries symbols and
# is ~10x a stripped release one, which is why debug APKs were ~300MB.
# opt-level=z + strip keeps the release .so (and the APK) small.
[profile.release]
opt-level = "z"
strip = true
codegen-units = 1
